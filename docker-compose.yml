# LOCAL DEVELOPMENT ONLY. Server compose lives in deploy/compose.server.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg_local_only
      POSTGRES_DB: thecrushguy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d thecrushguy"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
