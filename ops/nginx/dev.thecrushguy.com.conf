# Host nginx on the shared Hetzner server (same pattern as postaja). Install (owner):
#   sudo cp dev.thecrushguy.com.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/dev.thecrushguy.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dev.thecrushguy.com    # adds the 443 block + redirect
server {
    listen 80;
    listen [::]:80;
    server_name dev.thecrushguy.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
