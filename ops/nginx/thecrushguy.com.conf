# Host nginx on the shared Hetzner server (same pattern as postaja). Install (owner):
#   sudo cp thecrushguy.com.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/thecrushguy.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d thecrushguy.com -d www.thecrushguy.com   # adds the 443 blocks + http→https redirect
server {
    listen 80;
    listen [::]:80;
    server_name thecrushguy.com;

    client_max_body_size 10M;

    # Cloudflare (docs/runbooks/go-live-prod.md §2): real visitor IP from CF-Connecting-IP (only trusted from CF ranges).
    include snippets/cloudflare-realip.conf;
    # Enable AFTER the hostname is proxied (orange cloud): refuse requests that bypass Cloudflare, so
    # CF-IPCountry (age gate) and the visitor IP can't be spoofed by hitting the origin directly.
    # if ($from_cloudflare = 0) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# www → apex (one canonical host for SEO)
server {
    listen 80;
    listen [::]:80;
    server_name www.thecrushguy.com;
    return 301 https://thecrushguy.com$request_uri;
}
